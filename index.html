  <script>
    let rawLoadedMarkdown = '';
    let currentFontSizePx = 17;

    // सर्व नको असलेल्या बाह्य लिंक्स काढून टाकणे
    function cleanMarkdownLinks(text) {
      if (!text) return '';
      // [Anchor Text](http...) -> Anchor Text
      let cleaned = text.replace(/\[([^\]]+)\]\(https?:\/\/[^\)]+\)/g, '$1');
      // उरलेल्या थेट URLs काढून टाकणे
      cleaned = cleaned.replace(/https?:\/\/[^\s\)\>]+/g, '');
      return cleaned;
    }

    // Markdown चे व्हिज्युअल कार्ड्स आणि ॲप-स्टाईल बॅजेसमध्ये रूपांतर
    function enhanceMarkdownStyling(mdText) {
      let formatted = mdText;

      // Chapter Headings (## Heading)
      formatted = formatted.replace(/(?:\*\*🟦 CURRENT AFFAIRS 2026\*\*\s+)?\*\*January 2026 — Chapter (\d+)\*\*\s+([^\n]+)/gi, function(match, num, title) {
        return `\n## 📘 घटक ${num}: ${title.trim()}\n`;
      });

      return formatted;
    }

    // HTML तयार झाल्यावर 'Exam Trap' आणि 'Revision' बॉक्सेसना खास कार्ड लूक देणे
    function applyAppCardStyles() {
      const container = document.getElementById('notes-content');
      if (!container) return;

      // सर्व blockquotes तपासून Exam Trap किंवा One Page Revision प्रमाणे रंग देणे
      const blockquotes = container.querySelectorAll('blockquote');
      blockquotes.forEach(bq => {
        const text = bq.innerText.toLowerCase();
        if (text.includes('exam trap') || text.includes('trap')) {
          bq.className = 'exam-trap-box';
        } else if (text.includes('revision') || text.includes('quick revision')) {
          bq.className = 'exam-revision-box';
        }
      });
    }

    // Markdown फाईल लोड करणे
    async function loadMarkdownFile() {
      const spinner = document.getElementById('loading-spinner');
      const contentEl = document.getElementById('notes-content');

      try {
        const response = await fetch('Current_Affairs_JAN26_2.md');
        
        if (!response.ok) {
          throw new Error(`HTTP Error ${response.status}: फाईल सापडली नाही.`);
        }

        const rawText = await response.text();
        rawLoadedMarkdown = cleanMarkdownLinks(rawText);
        
        spinner.classList.add('hidden');
        contentEl.classList.remove('hidden');
        renderContent(rawLoadedMarkdown);

      } catch (err) {
        spinner.innerHTML = `
          <div class="text-center p-6 bg-rose-50 dark:bg-rose-950/30 rounded-xl border border-rose-200 text-rose-800 dark:text-rose-300">
            <p class="font-bold text-base mb-1">⚠️ नोट्स फाईल लोड होऊ शकली नाही</p>
            <p class="text-xs">${err.message}</p>
            <p class="text-xs mt-3 text-slate-500">खात्री करा की <b>Current_Affairs_JAN26_2.md</b> ही फाईल याच फोल्डरमध्ये (Root डिरेक्टरीमध्ये) आहे.</p>
          </div>
        `;
      }
    }

    // Markdown चे HTML मध्ये रूपांतर करून दाखवणे
    function renderContent(md) {
      const styledMd = enhanceMarkdownStyling(md);
      document.getElementById('notes-content').innerHTML = marked.parse(styledMd);
      applyAppCardStyles();
    }

    // विशिष्ट घटक (Chapter) फिल्टर करणे
    function filterByChapter(chapterKeyword) {
      if (!rawLoadedMarkdown) return;

      if (chapterKeyword === 'all') {
        renderContent(rawLoadedMarkdown);
        window.scrollTo({ top: 0, behavior: 'smooth' });
        return;
      }

      const chapters = rawLoadedMarkdown.split(/(?=\*\*January 2026 — Chapter|\*\*January 2026 — Ch)/i);
      const matched = chapters.find(c => c.toLowerCase().includes(chapterKeyword.toLowerCase()));

      if (matched) {
        renderContent(matched);
        window.scrollTo({ top: 120, behavior: 'smooth' });
      } else {
        renderContent(rawLoadedMarkdown);
      }
    }

    // कीवर्डनुसार सर्च करणे
    function searchWithinNotes(term) {
      if (!rawLoadedMarkdown) return;
      if (!term || term.trim() === '') {
        renderContent(rawLoadedMarkdown);
        return;
      }

      const cleanTerm = term.trim().toLowerCase();
      const lines = rawLoadedMarkdown.split('\n');
      let matchedSections = [];
      let currentSection = [];
      let matchFound = false;

      for (let line of lines) {
        if (line.startsWith('**Chapter') || line.startsWith('①') || line.startsWith('②') || line.startsWith('③') || line.startsWith('④') || line.startsWith('⑤') || line.startsWith('⑥') || line.startsWith('⑦') || line.startsWith('⑧') || line.startsWith('⑨') || line.startsWith('⑩')) {
          if (matchFound && currentSection.length > 0) {
            matchedSections.push(currentSection.join('\n'));
          }
          currentSection = [line];
          matchFound = line.toLowerCase().includes(cleanTerm);
        } else {
          currentSection.push(line);
          if (line.toLowerCase().includes(cleanTerm)) matchFound = true;
        }
      }
      if (matchFound && currentSection.length > 0) matchedSections.push(currentSection.join('\n'));

      if (matchedSections.length > 0) {
        renderContent(`> 🔍 **"${term}"** संदर्भात मिळालेले महत्त्वाचे मुद्दे:\n\n---\n\n` + matchedSections.join('\n\n---\n\n'));
      } else {
        renderContent(`> ❌ **"${term}"** संदर्भात कोणतीही नोंद सापडली नाही.`);
      }
    }

    // वाचन प्रोग्रेस बार अपडेट करणे
    window.addEventListener('scroll', () => {
      const winScroll = document.body.scrollTop || document.documentElement.scrollTop;
      const height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
      const scrolled = (winScroll / height) * 100;
      const prog = document.getElementById('reading-progress');
      if (prog) prog.style.width = scrolled + '%';
    });

    // थीम बदलणे (Dark / Light)
    function toggleDarkMode() {
      const html = document.documentElement;
      const icon = document.getElementById('theme-icon');
      if (html.classList.contains('dark')) {
        html.classList.remove('dark');
        icon.textContent = '🌙';
      } else {
        html.classList.add('dark');
        icon.textContent = '☀️';
      }
    }

    // फॉन्ट आकार कमी-जास्त करणे
    function adjustFontSize(delta) {
      currentFontSizePx += delta;
      if (currentFontSizePx < 14) currentFontSizePx = 14;
      if (currentFontSizePx > 26) currentFontSizePx = 26;
      document.getElementById('notes-content').style.fontSize = `${currentFontSizePx}px`;
    }

    window.addEventListener('DOMContentLoaded', loadMarkdownFile);
  </script>
</body>
</html>
